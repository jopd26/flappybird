<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird - GitHub Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Flappy Bird</h1>
    <p class="hint">Click or press Space to flap. Avoid the pipes!</p>
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    <div class="controls">
      <button id="restartButton">Restart</button>
    </div>
    <div class="instructions">
      <p>Score is the number of pipes passed.</p>
      <p>Click the button or press Space to start or restart.</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
